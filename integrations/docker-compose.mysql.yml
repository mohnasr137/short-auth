services:
  # 1. MySQL Database
  db:
    image: mysql:latest
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: "123456"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --disable-log-bin
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. All-in-One Auth Service (Keycloak + Go Gateway)
  short-auth:
    image: short-auth:latest
    container_name: short_auth
    restart: always
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      DB_VENDOR: mysql
      DB_URL: jdbc:mysql://db:3306/keycloak?characterEncoding=UTF-8
      DB_USERNAME: keycloak
      DB_PASSWORD: "123456"
      DB_SCHEMA: keycloak
      PORT: ":3000"
      ENV: production
      GIN_MODE: release
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"

  # 3. Web-based Database Management UI
  adminer:
    image: adminer:latest
    container_name: adminer_ui
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

