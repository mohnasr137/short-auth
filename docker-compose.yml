services:
  short-auth:
    image: short-auth:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: short-auth
    restart: unless-stopped
    ports:
      - "3000:3000"  # Go Auth Microservice API Gateway
      - "8080:8080"  # Keycloak Admin Console & OpenID Discovery
    environment:
      - "DB_VENDOR=${DB_VENDOR:-postgres}"
      - "DB_URL=${DB_URL:?❌ ERROR: DB_URL is required in .env! (See .env.example)}"
      - "DB_USERNAME=${DB_USERNAME:?❌ ERROR: DB_USERNAME is required in .env!}"
      - "DB_PASSWORD=${DB_PASSWORD:?❌ ERROR: DB_PASSWORD is required in .env!}"
      - "DB_SCHEMA=${DB_SCHEMA:-keycloak}"
      - "ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173,http://localhost:8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # Optional local PostgreSQL database for developers who don't have one running
  # Activated by running: docker compose --profile with-db up -d
  # ============================================================================
  postgres:
    image: postgres:alpine
    container_name: auth-postgres
    profiles: ["with-db"]
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_DB=${DB_NAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: